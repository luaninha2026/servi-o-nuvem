<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica Pessoal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- fonte mais estilizada e moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card" id="weather-card">
            <h1>Estação Meteorológica Pessoal</h1>
            <div class="input-group">
                <input type="text" id="cidade-input" placeholder="Digite a cidade...">
                <button id="buscar-btn">Buscar</button>
            </div>
            <div class="local-group">
                <button id="local-btn" title="Buscar clima do meu local atual">📍 Meu Local Atual</button>
            </div>
            <div class="resultado" id="resultado">
                <!-- Os dados do clima aparecerão aqui -->
            </div>
        </div>
        <div class="historico">
            <h3>Últimas cidades pesquisadas</h3>
            <div id="historico-lista"></div>
            <button id="limpar-historico-btn">Limpar histórico</button>
        </div>
    </div>

    <div class="theme-toggle">
        <label for="dark-mode-toggle">
            <input type="checkbox" id="dark-mode-toggle" style="display: none;">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
        </label>
    </div>

    <script src="javascript/script.js"></script>
</body>
</html>
